name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# changesets/action needs to push the version branch + tags and open the
# "Version Packages" PR. New repos default to a read-only GITHUB_TOKEN,
# so grant these explicitly.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip Husky hook installation in CI. `bun install` runs the `prepare`
    # script (`bunx husky`), which would otherwise install the pre-push hook;
    # when changesets/action pushes the Version Packages PR, that hook fires
    # `bun run test` (browser tests) in a job with no Playwright browser,
    # failing the push. Tests already run in the Check workflow.
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # No `registry-url` here: it would point npm's userconfig at a file
          # that reads the unset NODE_AUTH_TOKEN, superseding the ~/.npmrc the
          # changesets action writes from NPM_TOKEN and breaking authentication.
          package-manager-cache: false

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
  # Builds the native Storybook app as an Android APK on every main push.
  # rn-motion-ui is a public
  # repo, so GitHub-hosted runners are free (no self-hosted SDK needed).
  # The APK lets anyone install the component library demo directly on a
  # device; the APK is uploaded to MEGA S4 (rn-motion-ui-apks bucket) and
  # the 7-day presigned download link is sent to the offkeep Telegram bot —
  # no GitHub artifacts or prereleases for APKs.
  apk:
    name: Build native storybook APK
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Expo prebuild and the RN gradle build need a JDK; the runner image
      # default is not guaranteed to be 17, and RN 0.86 / AGP 8.x target 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # First gradle build downloads the distribution + deps (~10-20 min);
      # cache everything so subsequent main pushes are incremental.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('storybook/native/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # .rnstorybook/storybook.requires.ts is gitignored (regenerated by
      # sb-rn-get-stories); without it the entry point cannot resolve
      # ./storybook.requires and the JS bundle step fails.
      - name: Generate Storybook stories manifest
        working-directory: storybook/native
        run: bun run storybook-generate

      - name: Generate Android project
        working-directory: storybook/native
        run: npx expo prebuild -p android --no-install --no-clean

      - name: Build APK
        working-directory: storybook/native/android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          # --no-parallel: the Expo/RN composite build races on the execution
          # history cache lock under parallel=true.
          # arm64-v8a only: the sole ABI real devices use; halves NDK/CMake
          # compile time. --build-cache reuses task outputs across runs.
          ./gradlew assembleRelease --no-parallel -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Upload APK to MEGA S4
        id: upload-s4
        env:
          S4_APK_ACCESS_KEY_ID: ${{ secrets.S4_APK_ACCESS_KEY_ID }}
          S4_APK_SECRET_ACCESS_KEY: ${{ secrets.S4_APK_SECRET_ACCESS_KEY }}
          S4_APK_ENDPOINT: ${{ vars.S4_APK_ENDPOINT }}
          S4_APK_REGION: ${{ vars.S4_APK_REGION }}
          S4_APK_BUCKET: ${{ vars.S4_APK_BUCKET }}
        run: |
          APK_PATH="storybook/native/android/app/build/outputs/apk/release/app-release.apk"
          S4_KEY="apks/${{ github.run_number }}/app-release-${GITHUB_SHA::7}.apk"
          URL=$(python3 .github/scripts/upload-apk-to-s4.py \
            --file "$APK_PATH" \
            --key "$S4_KEY" \
            --endpoint "$S4_APK_ENDPOINT" \
            --region "$S4_APK_REGION" \
            --bucket "$S4_APK_BUCKET" \
            --access-key "$S4_APK_ACCESS_KEY_ID" \
            --secret-key "$S4_APK_SECRET_ACCESS_KEY" \
            --prune-keep 5 \
            --prune-prefix "apks/")
          if [ -z "$URL" ]; then
            echo "S4 upload failed (no presigned URL returned)"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Send download link via Telegram
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          PARIS_DATE="$(TZ=Europe/Paris date +'%Y-%m-%d %H:%M Paris')"
          APK_URL="${{ steps.upload-s4.outputs.url }}"
          # HTML link: escape & (presigned-URL query separators) as &amp;
          APK_URL_HTML="${APK_URL//&/&amp;}"

          MESSAGE=$(printf '📦 <b>rn-motion-ui storybook APK</b>\nCommit: <code>%s</code>\nDate: %s / %s\nExpires: 7 days\n\n<a href="%s">⬇ Download APK</a>' \
            "$SHORT_SHA" "$BUILD_DATE" "$PARIS_DATE" "$APK_URL_HTML")

          RESPONSE=$(curl -s -w '%{http_code}' -o "$RUNNER_TEMP/telegram_response.json" \
            --max-time 30 \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")

          if [ "$RESPONSE" != "200" ]; then
            echo "Telegram send failed with HTTP $RESPONSE"
            cat "$RUNNER_TEMP/telegram_response.json"
            exit 1
          fi

          OK=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/telegram_response.json')).get('ok', False))")
          if [ "$OK" != "True" ]; then
            echo "Telegram API returned ok=false"
            cat "$RUNNER_TEMP/telegram_response.json"
            exit 1
          fi

          echo "APK download link sent to Telegram"
